<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十人問色</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ロード画面 -->
  <div id="loading-screen" class="screen" style="display: none; text-align: center; margin-top: 50px;">
    <h2> 通信中...</h2>
    <p style="color: #aaa;">データを読み込んでいます</p>
  </div>
  <div id="login-screen" class="screen">
    <h1>十人問色</h1>
    <p>ニックネームを入力してください。</p>
    <p>このゲームを通して個人情報は入れないでください</p>
    <input type="text" id="nickname-input" placeholder="ニックネーム">
    <button onclick="login()">start</button>
  </div>

  <div id="home-screen" class="screen" style="display: none;">
    <div class="header-status">
      <span id="display-name"></span>
      <span>1st正解: <span id="first-blood-count">0</span> / 正解: <span id="solve-count">0</span></span>
    </div>
    <h2>問題一覧</h2>
    <div id="question-list"></div>
  </div>

  <div id="detail-screen" class="screen" style="display: none;">
    <button class="back-btn" onclick="showHomeScreen()">← ホームに戻る</button>
    <h2 id="detail-title"></h2>
    
    <div id="detail-description" class="question-box"></div>
    <div id="detail-dynamic-text" class="question-box" style="display: none; color: #ffeb3b; font-weight:bold;"></div>
    
    <div id="detail-media" style="display: none; margin: 15px 0;"></div>

    <div class="answer-section">
      <p style="font-size: 14px; color: #aaa;">クールタイム: <span id="detail-cooltime"></span>秒</p>
      
      <div id="normal-answer-area">
        <input type="text" id="answer-input" placeholder="解答を入力">
      </div>
      
      <!-- Lyrics用 単一解答欄 -->
      <div id="multi-answer-area" style="display: none;">
        <p id="multi-progress" style="font-weight:bold;"></p>
        <div id="multi-solved-list" style="margin-bottom: 10px; font-size: 14px; color: #4CAF50;"></div>
        <input type="text" id="multi-single-input" placeholder="メンバー名を入力">
      </div>
      
      <button id="submit-btn" onclick="submitAnswer()">解答する</button>
      <p id="cooltime-message" class="error-text"></p>
    </div>
    <button class="back-btn" onclick="showHomeScreen()" style="margin-top: 30px;">← ホームに戻る</button>
  </div>

  <div id="image-modal" class="modal" onclick="closeModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modal-img">
  </div>
  <script src="script.js?v=6"></script>
</body>
</html>
